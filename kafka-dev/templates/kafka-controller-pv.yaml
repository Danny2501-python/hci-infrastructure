{{- if .Values.controller.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-controller-local-pv
spec:
  capacity:
    storage: {{ .Values.controller.persistence.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.controller.persistence.storageClass }}
  local:
    path: {{ .Values.controller.persistence.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s1
{{- end }}

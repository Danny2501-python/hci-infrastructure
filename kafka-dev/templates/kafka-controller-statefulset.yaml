apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    app.kubernetes.io/name: kafka-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-controller
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chmod -R 777 /var/lib/kafka/data || true"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.controller.persistence.mountPath | default "/var/lib/kafka/data" }}
          securityContext:
            runAsUser: 0
      containers:
        - name: kafka-controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "{{ .Values.controller.nodeId }}"
            - name: KAFKA_CFG_NODE_ID
              value: "{{ .Values.controller.nodeId }}"
            - name: KAFKA_PROCESS_ROLES
              value: "controller"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "{{ .Values.controller.nodeId }}@{{ .Release.Name }}-controller:9093"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "{{ .Values.controller.nodeId }}@{{ .Release.Name }}-controller:9093"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_LOG_DIRS
              value: "{{ .Values.controller.persistence.mountPath | default "/var/lib/kafka/data" }}"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_HEAP_OPTS
              value: "{{ .Values.controller.heapOpts | default "-Xms512m -Xmx768m" }}"
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.controller.persistence.mountPath | default "/var/lib/kafka/data" }}
      volumes:
        - name: data
          {{- if .Values.controller.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-controller-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

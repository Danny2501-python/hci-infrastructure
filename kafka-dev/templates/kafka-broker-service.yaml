apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-broker
  labels:
    app.kubernetes.io/name: kafka-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.broker.service.type }}
  ports:
    - name: kafka
      port: {{ .Values.broker.service.port }}
      targetPort: 9092
      {{- if and (eq .Values.broker.service.type "NodePort") .Values.broker.service.nodePort }}
      nodePort: {{ .Values.broker.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: kafka-broker
    app.kubernetes.io/instance: {{ .Release.Name }}

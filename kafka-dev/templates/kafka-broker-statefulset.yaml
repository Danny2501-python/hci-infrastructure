apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-broker
  labels:
    app.kubernetes.io/name: kafka-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-broker
  replicas: {{ .Values.broker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-broker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chmod -R 777 /var/lib/kafka/data || true"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.broker.persistence.mountPath | default "/var/lib/kafka/data" }}
          securityContext:
            runAsUser: 0
        - name: wait-for-controller
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-controller 9093; do echo waiting for controller...; sleep 2; done;']
      containers:
        - name: kafka-broker
          image: "{{ .Values.broker.image.repository }}:{{ .Values.broker.image.tag }}"
          imagePullPolicy: {{ .Values.broker.image.pullPolicy }}
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "{{ .Values.broker.nodeId }}"
            - name: KAFKA_CFG_NODE_ID
              value: "{{ .Values.broker.nodeId }}"
            - name: KAFKA_PROCESS_ROLES
              value: "broker"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "{{ .Values.controller.nodeId }}@{{ .Release.Name }}-controller:9093"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "{{ .Values.controller.nodeId }}@{{ .Release.Name }}-controller:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ .Release.Name }}-broker:9092"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ .Release.Name }}-broker:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: "{{ .Values.kraft.clusterId }}"
            - name: KAFKA_LOG_DIRS
              value: "{{ .Values.broker.persistence.mountPath | default "/var/lib/kafka/data" }}"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.broker.persistence.mountPath | default "/var/lib/kafka/data" }}
      volumes:
        - name: data
          {{- if .Values.broker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-broker-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

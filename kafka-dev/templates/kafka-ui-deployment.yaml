{{- if .Values.kafkaUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-ui
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.kafkaUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-broker
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-broker 9092; do echo waiting for kafka broker...; sleep 2; done;']
        {{- if .Values.schemaRegistry.enabled }}
        - name: wait-for-schema-registry
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-schema-registry 8081; do echo waiting for schema registry...; sleep 2; done;']
        {{- end }}
      containers:
        - name: kafka-ui
          image: "{{ .Values.kafkaUi.image.repository }}:{{ .Values.kafkaUi.image.tag }}"
          imagePullPolicy: {{ .Values.kafkaUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.kafkaUi.service.port }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "kraft-lakehouse-cluster"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{ .Release.Name }}-broker:9092"
            {{- if .Values.schemaRegistry.enabled }}
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: "http://{{ .Release.Name }}-schema-registry:8081"
            {{- end }}
          resources:
            {{- toYaml .Values.kafkaUi.resources | nindent 12 }}
{{- end }}

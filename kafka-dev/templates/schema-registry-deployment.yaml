{{- if .Values.schemaRegistry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.schemaRegistry.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-broker
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-broker 9092; do echo waiting for kafka broker...; sleep 2; done;']
      containers:
        - name: schema-registry
          image: "{{ .Values.schemaRegistry.image.repository }}:{{ .Values.schemaRegistry.image.tag }}"
          imagePullPolicy: {{ .Values.schemaRegistry.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.schemaRegistry.service.port }}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "{{ .Release.Name }}-schema-registry"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://{{ .Release.Name }}-broker:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:{{ .Values.schemaRegistry.service.port }}"
          resources:
            {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
{{- end }}

global:
  namespace: default

kraft:
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"

controller:
  nodeId: 1
  replicaCount: 1
  image:
    repository: confluentinc/cp-kafka
    tag: 7.6.0
    pullPolicy: IfNotPresent
  service:
    port: 9093
  persistence:
    enabled: true
    storageClass: "local-storage"
    size: 5Gi
    path: "/mnt/data/kafka-controller"
    mountPath: "/var/lib/kafka/data"
  heapOpts: "-Xms512m -Xmx768m"
  resources:
    limits:
      cpu: 500m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi

broker:
  nodeId: 2
  replicaCount: 1
  image:
    repository: confluentinc/cp-kafka
    tag: 7.6.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9092
    nodePort: 30092
  persistence:
    enabled: true
    storageClass: "local-storage"
    size: 10Gi
    path: "/mnt/data/kafka-broker"
    mountPath: "/var/lib/kafka/data"
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi

schemaRegistry:
  enabled: true
  replicaCount: 1
  image:
    repository: confluentinc/cp-schema-registry
    tag: 7.6.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    nodePort: 30081
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 512Mi

kafkaUi:
  enabled: true
  replicaCount: 1
  image:
    repository: provectuslabs/kafka-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: 30080
  ingress:
    enabled: true
    className: "nginx"
    host: kafka-ui.lakehouse.com
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

apiVersion: v1
kind: Service
metadata:
  name: jupyter-svc
  namespace: jupyter-notebook
spec:
  selector:
    app: jupyter
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-deployment
  namespace: jupyter-notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      securityContext:
        fsGroup: 100
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:100 /home/jovyan/work"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: workspace
          mountPath: /home/jovyan/work
      containers:
      - name: jupyter
        image: jupyter/datascience-notebook:latest
        ports:
        - containerPort: 8888
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "3"
            memory: "6Gi"
        env:
        - name: JUPYTER_TOKEN
          value: "sci-lakehouse"
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: NB_UID
          value: "1000"
        - name: NB_GID
          value: "100"
        - name: CHOWN_HOME
          value: "yes"
        volumeMounts:
        - name: workspace
          mountPath: /home/jovyan/work
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: jupyter-nfs-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-ingress
  namespace: jupyter-notebook
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx # Lay giong ingress hien tai cua ban
  rules:
  - host: jupyter.lakehouse.com # Thay doi host theo y muon
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jupyter-svc
            port:
              number: 80

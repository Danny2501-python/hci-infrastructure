apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    app: trino
    component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      component: coordinator
  template:
    metadata:
      labels:
        app: trino
        component: coordinator
    spec:
      containers:
      - name: trino
        image: 111050/trino:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        volumeMounts:
        {{- range .Values.iceberg.catalogs }}
        - name: catalog-{{ .name }}
          mountPath: "/etc/trino/catalog/{{ .name }}.properties"
          subPath: "{{ .name }}.properties"
        {{- end }}
        - name: config-volume
          mountPath: /etc/trino/config.properties
          subPath: config.properties
        - name: config-volume
          mountPath: /etc/trino/jvm.config
          subPath: jvm.config
      volumes:
      {{- range .Values.iceberg.catalogs }}
      - name: catalog-{{ .name }}
        configMap:
          name: trino-catalog-{{ .name }}
      {{- end }}
      - name: config-volume
        configMap:
          name: trino-coordinator-config

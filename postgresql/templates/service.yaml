apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP       # Internal access only
  clusterIP: 10.152.183.183
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432           # Cổng dịch vụ bên ngoài
      targetPort: 5432     # Cổng của pod mà dịch vụ chuyển tiếp đến
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spark-iceberg-warehouse-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  mountOptions:
    - hard
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - timeo=600
    - retrans=2
  nfs:
    server: 10.10.10.245
    path: /srv/nfs_share/spark-iceberg/warehouse
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spark-iceberg-notebooks-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  mountOptions:
    - hard
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - timeo=600
    - retrans=2
  nfs:
    server: 10.10.10.245
    path: /srv/nfs_share/spark-iceberg/notebooks


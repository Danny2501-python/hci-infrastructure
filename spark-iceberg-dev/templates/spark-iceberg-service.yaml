apiVersion: v1
kind: Service
metadata:
  labels:
    app: spark-iceberg
  name: spark-iceberg
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: "8888"
      port: 8888
      targetPort: 8888
    - name: "8080"
      port: 8080
      targetPort: 8080
    - name: "10000"
      port: 10000
      targetPort: 10000
    - name: "10001"
      port: 10001
      targetPort: 10001
  selector:
    app: spark-iceberg
status:
  loadBalancer: {}

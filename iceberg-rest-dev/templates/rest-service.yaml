{{- range .Values.catalogs }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: iceberg-rest
    catalog: {{ .name }}
  name: iceberg-rest-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: {{ $.Values.port }}
  selector:
    app: iceberg-rest
    catalog: {{ .name }}
{{- end }}

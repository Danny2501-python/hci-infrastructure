apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-dags-nfs-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - timeo=600
    - retrans=2
  nfs:
    server: 10.10.10.245
    path: /srv/nfs_share/airflow/dags


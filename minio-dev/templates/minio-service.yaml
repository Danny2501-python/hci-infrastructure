apiVersion: v1
kind: Service
metadata:
  labels:
    app: minio
  name: minio
  namespace: default
spec:
  type: ClusterIP
  clusterIP: 10.152.183.65  # Fixed IP to ensure consistency
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: minio
status:
  loadBalancer: {}
